server:
  port: 8088

spring:
  application:
    name: pay-example
  datasource:
    url: jdbc:h2:file:./data/example;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false

conflux.pay:
  configs:
    demo:
      mock:
        # 回调配置由业务按订单查库得到 configId 后显式传入 parseCallback(configId, request)
        notifyUrl: http://127.0.0.1:8088/callback/mock
        sandbox: false
        attr:
          appKey: demo-app-key
          payOutcome: paying
