server:
  port: 8088

spring:
  application:
    name: pay-example
  datasource:
    url: jdbc:h2:file:./data/example;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false

conflux.pay:
  apps:
    demo:
      mock:
        # 普通商户账户键 = appKey；服务商模式追加 subMchNo 组成 appKey#subMchNo，
        # 回调地址改为 ?accountKey=<appKey>%23<subMchNo>；账户键冲突会在启动期直接报错
        notifyUrl: http://127.0.0.1:8088/callback/mock
        sandbox: false
        attrs:
          appKey: demo-app-key
          payOutcome: paying
